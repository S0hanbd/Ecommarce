{% extends 'base.html' %}

{% block title %}403 - Access Denied | Shopcart{% endblock %}

{% block content %}
<div class="container" style="padding: 80px 20px; text-align: center; max-width: 650px; margin: 0 auto;">
  <div style="font-size: 5rem; font-weight: 900; color: #f59e0b; line-height: 1; margin-bottom: 20px;">
    403
  </div>
  <div style="font-size: 1.8rem; font-weight: 700; color: var(--text-dark); margin-bottom: 16px;">
    Access Denied
  </div>
  <p style="color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 32px;">
    You do not have permission to view this resource. Please make sure you are logged in to the correct account.
  </p>
  <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
    <a href="{% url 'shop:product_list' %}" class="btn-primary" style="padding: 12px 28px; font-weight: 700;">
      <i class="fa-solid fa-house" style="margin-right: 8px;"></i> Return to Shop
    </a>
    <a href="{% url 'login' %}" class="btn-secondary" style="padding: 12px 28px; font-weight: 700;">
      <i class="fa-solid fa-user" style="margin-right: 8px;"></i> Login to Account
    </a>
  </div>
</div>
{% endblock %}
